name: Daily sync upstream + build combined playlist

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC = 03:00 hiver / 04:00 été à Montréal
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: iptv-daily-sync
  cancel-in-progress: false

jobs:
  sync_build_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge upstream
        run: |
          git remote add upstream https://github.com/iptv-org/iptv.git || \
            git remote set-url upstream https://github.com/iptv-org/iptv.git

          git fetch upstream master

          git merge upstream/master --no-edit || {
            echo "Merge conflicts detected"

            # Keep this fork's GitHub Actions workflows when upstream conflicts with them.
            git checkout --ours .github/workflows/
            git add .github/workflows/

            # Abort if any conflicts remain outside the workflows directory.
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              exit 1
            fi

            git commit --no-edit
          }

      - name: Build combined playlist
        run: |
          bash scripts/build-combined-m3u.sh

      - name: Create or update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/daily-sync
          base: master
          title: "Daily upstream sync + rebuild combined.m3u"
          body: |
            - Synchronisation depuis iptv-org/iptv (master)
            - Regénération de custom2/combined.m3u
            - Ajout de custom2/my.m3u
            - Conversion Viamotion DASH vers HLS8 lorsqu'une version HLS est disponible
          labels: |
            upstream-sync
            playlist
          add-paths: |
            custom2/combined.m3u
          commit-message: "chore: rebuild combined playlist"
          delete-branch: true
