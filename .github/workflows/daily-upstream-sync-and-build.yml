name: Daily sync upstream + build combined playlist

on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: iptv-daily-sync
  cancel-in-progress: false

jobs:
  sync_build_pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Verify local scripts
        run: |
          test -f scripts/build-combined-m3u.sh
          test -f scripts/validate-custom-playlist.py
          test -f custom2/my.m3u

      - name: Build combined playlist
        shell: bash
        run: |
          bash scripts/build-combined-m3u.sh

      - name: Verify generated playlist
        shell: bash
        run: |
          test -s custom2/combined.m3u
          python3 scripts/validate-custom-playlist.py custom2/combined.m3u
          echo "Playlist statistics:"
          wc -l custom2/combined.m3u
          git status --short

      - name: Create or update Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/daily-sync
          base: master
          title: "Daily upstream playlist rebuild"
          body: |
            Synchronisation quotidienne de la playlist IPTV publiée.

            - Téléchargement de la playlist officielle iptv-org
            - Conservation de custom2/my.m3u
            - Génération de custom2/combined.m3u
            - Conversion Viamotion DASH vers HLS8
            - Validation du fichier M3U

            Le code upstream et les workflows du fork ne sont pas modifiés.
          add-paths: |
            custom2/combined.m3u
          commit-message: "chore: rebuild combined playlist"
          delete-branch: true
